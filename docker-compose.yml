# a4a with Postgres. Start: docker compose up --build, then open http://localhost:3000
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: a4a
      POSTGRES_PASSWORD: a4a
      POSTGRES_DB: a4a
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U a4a']
      interval: 5s
      retries: 20

  a4a:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://a4a:a4a@postgres:5432/a4a
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Set to enable triage, duplicate judging, words-to-query/command and the assistant.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional unattended first administrator (otherwise the web UI asks on first visit):
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}

volumes:
  pgdata:
