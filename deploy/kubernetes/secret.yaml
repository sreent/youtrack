# What a4a must keep secret. The values are placeholders: create the real Secret from your secret
# store, or fill in a copy of this file that never goes into version control. kustomization.yaml
# leaves this file out, so `kubectl apply -k` never applies the placeholders (docs/deploying.md).
apiVersion: v1
kind: Secret
metadata:
  name: a4a
  namespace: a4a
type: Opaque
stringData:
  # Seals two-factor secrets, tokens and client secrets in the database. The same on every replica,
  # for good: a4a can't change to another key, and losing it loses what it sealed. Make it once
  # with `openssl rand -base64 32`, and keep a copy apart from the database's backups.
  SECRET_KEY: "REPLACE-with-the-output-of-openssl-rand-base64-32"
  DATABASE_URL: "postgres://a4a:REPLACE-with-the-password@postgres.example.internal:5432/a4a"
  S3_ACCESS_KEY_ID: "REPLACE-with-the-access-key-id"
  S3_SECRET_ACCESS_KEY: "REPLACE-with-the-secret-access-key"
  # Usually set too:
  # SMTP_URL: "smtp://a4a%40example.com:REPLACE-with-the-password@smtp.example.com:587"
  # ANTHROPIC_API_KEY: "REPLACE-with-the-key"
  # The first administrator, at the first start only:
  # ADMIN_LOGIN: "admin"
  # ADMIN_PASSWORD: "REPLACE-with-a-long-password"
