# kubectl apply -k deploy/kubernetes, once the Secret exists. secret.yaml is left out on purpose:
# its values are placeholders (docs/deploying.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml
